[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burnstop"
version = "0.1.0"
description = "Local circuit-breaker proxy that stops runaway AI agents before they burn your Anthropic/OpenAI API budget."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "pyyaml>=6.0"]
keywords = ["anthropic", "openai", "llm", "agents", "proxy", "circuit-breaker", "cost-control"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
burnstop = "burnstop.cli:main"

[project.urls]
Homepage = "https://github.com/kelbic/burnstop"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
